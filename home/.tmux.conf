set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:sixel"
set -g allow-passthrough on

# Forward OSC 52 from apps out to the SSH client terminal. The default
# "external" only stores it in a tmux buffer, so nvim yanks never leave the
# host. The clipboard feature declares Ms, which xterm-256color terminfo omits.
set -as terminal-features ",*:clipboard"
set -g set-clipboard on
set -g status-style bg=default
set -g mouse on

